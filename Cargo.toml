[package]
name = "ticket-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A fast local terminal browser for Azure DevOps work items"
license = "MIT"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
directories = "6.0.0"
nucleo-matcher = "0.3.1"
open = "5.4.2"
ratatui = "0.30.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
time = { version = "0.3.47", features = ["formatting", "macros", "parsing"] }
url = "2.5.7"

[dev-dependencies]
pretty_assertions = "1.4.1"
tempfile = "3.23.0"

[profile.release]
lto = "thin"
strip = "symbols"
