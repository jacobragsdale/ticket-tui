apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: reaper
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv
    kind: SecretStore
  target:
    name: reaper-external
  data:
    - secretKey: REAPER_TOKEN
      remoteRef:
        key: reaper-token
  dataFrom:
    - extract:
        key: reaper-config
