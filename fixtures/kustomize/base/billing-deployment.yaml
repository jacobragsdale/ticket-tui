apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: billing-api
  template:
    metadata:
      labels:
        app: billing-api
    spec:
      containers:
        - name: api
          image: acrqa.azurecr.io/team/billing-api:2.0.1
          env:
            - name: SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: billing-kv
                  key: SIGNING_KEY
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: billing-kv
                  key: DB_PASSWORD
          volumeMounts:
            - name: vault
              mountPath: /mnt/secrets
              readOnly: true
      volumes:
        - name: vault
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: billing-vault
