apiVersion: v1
data:
  BANNER: |
    orders api
    two lines of it, and a colon: here
  LOG_LEVEL: info
kind: ConfigMap
metadata:
  name: orders-config
  namespace: shop-prod
---
apiVersion: v1
data:
  SESSION_KEY: cGxhY2Vob2xkZXI=
kind: Secret
metadata:
  name: orders-runtime-fd548dtc4m
  namespace: shop-prod
type: Opaque
---
apiVersion: v1
kind: Service
metadata:
  name: orders-api
  namespace: shop-prod
spec:
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: orders-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-api
  namespace: shop-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: billing-api
  template:
    metadata:
      labels:
        app: billing-api
    spec:
      containers:
      - env:
        - name: SIGNING_KEY
          valueFrom:
            secretKeyRef:
              key: SIGNING_KEY
              name: billing-kv
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: DB_PASSWORD
              name: billing-kv
        image: acrprod.azurecr.io/team/billing-api:2.0.1
        name: api
        volumeMounts:
        - mountPath: /mnt/secrets
          name: vault
          readOnly: true
      volumes:
      - csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: billing-vault
        name: vault
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: shop-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders-api
  template:
    metadata:
      labels:
        app: orders-api
    spec:
      containers:
      - env:
        - name: RATE_LIMIT_PER_MIN
          valueFrom:
            configMapKeyRef:
              key: RATE_LIMIT_PER_MIN
              name: orders-config
        - name: SESSION_KEY
          valueFrom:
            secretKeyRef:
              key: SESSION_KEY
              name: orders-runtime-fd548dtc4m
        - name: FEATURE_FLAGS
          valueFrom:
            configMapKeyRef:
              key: FLAGS
              name: orders-flags
              optional: true
        envFrom:
        - configMapRef:
            name: orders-config
        image: acrprod.azurecr.io/team/orders-api:1.3.9
        name: api
        volumeMounts:
        - mountPath: /etc/banner
          name: banner
      initContainers:
      - env:
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              key: LOG_LEVEL
              name: orders-config
        image: acrprod.azurecr.io/team/orders-migrate:1.3.9
        name: migrate
      volumes:
      - configMap:
          items:
          - key: BANNER
            path: banner.txt
          name: orders-config
        name: banner
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: reaper
  namespace: shop-prod
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - env:
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  key: LOG_LEVEL
                  name: orders-config
            envFrom:
            - secretRef:
                name: reaper-external
            image: acrprod.azurecr.io/team/reaper:0.9.0
            name: reaper
          restartPolicy: OnFailure
  schedule: 0 3 * * *
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: reaper
  namespace: shop-prod
spec:
  data:
  - remoteRef:
      key: reaper-token
    secretKey: REAPER_TOKEN
  dataFrom:
  - extract:
      key: reaper-config
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: azure-kv
  target:
    name: reaper-external
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: azure-kv
  namespace: shop-prod
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: https://kv-prod.vault.azure.net/
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: billing-vault
  namespace: shop-prod
spec:
  parameters:
    keyvaultName: kv-prod
    objects: |
      array:
        - |
          objectName: billing-signing-key
          objectType: secret
          objectAlias: SIGNING_KEY
        - |
          objectName: billing-db-password
          objectType: secret
          objectAlias: DB_PASSWORD
        - |
          objectName: billing-legacy-token
          objectType: secret
          objectAlias: LEGACY_TOKEN
    usePodIdentity: "false"
  provider: azure
  secretObjects:
  - data:
    - key: DB_PASSWORD
      objectName: DB_PASSWORD
    secretName: billing-kv
    type: Opaque
