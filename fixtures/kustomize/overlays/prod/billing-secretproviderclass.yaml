apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: billing-vault
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    keyvaultName: kv-prod
    # billing-legacy-token is asked of a vault that does not hold it. Nothing
    # in the repository can know that; #746 finds it against tab 7's vaults,
    # and `env check` must stay quiet about it.
    objects: |
      array:
        - |
          objectName: billing-signing-key
          objectType: secret
          objectAlias: SIGNING_KEY
        - |
          objectName: billing-db-password
          objectType: secret
          objectAlias: DB_PASSWORD
        - |
          objectName: billing-legacy-token
          objectType: secret
          objectAlias: LEGACY_TOKEN
  secretObjects:
    - secretName: billing-kv
      type: Opaque
      data:
        - objectName: DB_PASSWORD
          key: DB_PASSWORD
