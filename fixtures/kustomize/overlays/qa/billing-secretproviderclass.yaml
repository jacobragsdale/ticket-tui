apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: billing-vault
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    keyvaultName: kv-qa
    objects: |
      array:
        - |
          objectName: billing-signing-key
          objectType: secret
          objectAlias: SIGNING_KEY
        - |
          objectName: billing-db-password
          objectType: secret
          objectAlias: DB_PASSWORD
  secretObjects:
    - secretName: billing-kv
      type: Opaque
      data:
        - objectName: SIGNING_KEY
          key: SIGNING_KEY
        - objectName: DB_PASSWORD
          key: DB_PASSWORD
