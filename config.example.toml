# ticket-tui, in one file. Copy it to ~/.config/ticket-tui/config.toml
# ($XDG_CONFIG_HOME/ticket-tui/config.toml when that is set, on macOS as well),
# edit it, run `az login`, and run `ticket-tui`.
#
# Every table is optional and so is every key in it: a flag or a TICKET_TUI_*
# variable still wins over this file, and whatever none of the three name is
# left for the Azure CLI to answer. Keys a build does not know are ignored, so
# this file can grow without an older binary refusing it.

[devops]                      # tabs 1 to 4, and every subcommand
org = "myorg"                 # slug or https://dev.azure.com/myorg
project = "ISTO"              # where the work items live
code_project = "Fiquants"     # where the repos, pull requests and pipelines live; left out = project
# query = "[System.AreaPath] UNDER 'ISTO\\Team'"   # optional WIQL scope on every pull
# team = "Payments"           # one team of a department board: its areas narrow every
#                             # pull, its members fill the assignee picker, its sprint
#                             # is @current; `ticket-tui teams` prints the names
# workspace = "~/Development" # where clones live; a leading ~ is the home directory

# The colour theme. `preset` is terminal, terminal-light, mono or custom;
# left out, a [theme.custom] palette is painted if there is one and the
# terminal's own sixteen colours if there is not. The `theme` tool writes both
# of these tables for you.
[theme]
preset = "terminal"        # terminal · terminal-light · mono · custom (the palette below)

[theme.custom]
name = "neon-void"
appearance = "dark"
bg = "#05060a"
bg_deep = "#000000"
surface = "#0b0d14"
overlay = "#171b28"
fg = "#dfe6ff"
subtle = "#aab4dd"
muted = "#626c9c"
accent = "#c07cff"
red = "#ff5f87"
green = "#4ef5a4"
yellow = "#ffd75f"
blue = "#61a8ff"
cyan = "#4fe8ff"
orange = "#ff9e5e"
teal = "#29e0c8"

# A desktop notification when something worth interrupting for happens: a run
# you pressed `w` on finishes, a vote lands on a pull request you wrote, one
# turns up wanting your review, an approval lands on a run. The command is run through `sh -c`, detached, with its output
# thrown away, and the status line says the same words either way.
#
# {title} and {body} are replaced by the text as one complete single-quoted
# shell word — `it's` goes in as `'it'\''s'` — so write them where an argument
# goes and put no quotes of your own around them. Left out, there is no
# [notify] table and nothing is ever run.
[notify]
# macOS. The two values go through argv rather than into the AppleScript
# source, so a title holding a quote is still one string when it gets there.
command = "osascript -e 'on run argv' -e 'display notification (item 2 of argv) with title (item 1 of argv)' -e 'end run' {title} {body}"

# Linux:
# command = "notify-send {title} {body}"
